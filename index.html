<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>VEXA — ПВЗ</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#7c3aed;--primary-hover:#6d28d9;
  --primary-soft:#ede9fe;--primary-soft-2:#f5f3ff;
  --bg:#f4f5f9;--surface:#ffffff;--surface-2:#fafafc;
  --text:#111827;--text-2:#4b5563;--text-muted:#9ca3af;
  --border:#e5e7eb;--border-2:#eef0f4;
  --success:#059669;--success-soft:#d1fae5;
  --danger:#dc2626;--danger-soft:#fee2e2;
  --warning:#d97706;--warning-soft:#fef3c7;
  --info:#2563eb;--info-soft:#dbeafe;
  --muted-soft:#f3f4f6;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 4px 12px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.14);
  --radius-sm:8px;--radius:12px;--radius-lg:16px;--radius-xl:20px;
  --ui-scale:1;
  --topbar-h:62px;
}
[data-theme="dark"]{
  --primary:#8b5cf6;--primary-hover:#a78bfa;
  --primary-soft:#2e1f5c;--primary-soft-2:#241a45;
  --bg:#0d0d12;--surface:#17171f;--surface-2:#1e1e28;
  --text:#f4f4f7;--text-2:#b6b8c3;--text-muted:#7a7d8a;
  --border:#2a2a35;--border-2:#232330;
  --success:#34d399;--success-soft:#064e3b;
  --danger:#f87171;--danger-soft:#5c1e1e;
  --warning:#fbbf24;--warning-soft:#4a3408;
  --info:#60a5fa;--info-soft:#1e3a8a;
  --muted-soft:#232330;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 3px rgba(0,0,0,.5);
  --shadow-md:0 4px 12px rgba(0,0,0,.4);
  --shadow-lg:0 12px 32px rgba(0,0,0,.55);
}
html{font-size:calc(15px * var(--ui-scale))}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter','Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100vh;min-height:100dvh;
  transition:background .25s ease,color .25s ease;
  overflow-x:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.hidden{display:none !important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

.mobile-only{display:none !important}

.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
.logo svg{display:block}
.logo-text{font-size:1.4rem;background:linear-gradient(135deg,#8b5cf6,#6d28d9);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
[data-theme="dark"] .logo-text{background:linear-gradient(135deg,#a78bfa,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ============ LOGIN ============ */
.login-screen{
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:
    radial-gradient(1200px 600px at 10% 0%,rgba(124,58,237,.14),transparent 60%),
    radial-gradient(900px 500px at 110% 110%,rgba(124,58,237,.10),transparent 60%),
    var(--bg);
}
.login-card{
  width:100%;max-width:420px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-xl);padding:36px 32px 28px;
  box-shadow:var(--shadow-lg);
  animation:cardIn .45s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.login-card .logo{margin-bottom:22px}
.login-card h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.login-subtitle{color:var(--text-muted);margin-bottom:22px;font-size:.9rem}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.82rem;font-weight:600;color:var(--text-2);margin-bottom:7px}
.input{
  width:100%;padding:11px 14px;
  background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);outline:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:var(--surface)}
.input::placeholder{color:var(--text-muted)}
textarea.input{resize:vertical;min-height:80px}
.password-wrapper{position:relative}
.password-wrapper .input{padding-right:44px}
.password-wrapper .icon-btn{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;color:var(--text-muted);
}
.password-wrapper .icon-btn:hover{background:var(--muted-soft);color:var(--text)}
.login-error{color:var(--danger);font-size:.85rem;min-height:18px;margin:4px 0 12px;display:flex;align-items:center;gap:6px}
.login-hint{
  margin-top:18px;padding-top:18px;border-top:1px solid var(--border-2);
  font-size:.85rem;color:var(--text-muted);text-align:center;
}
.register-link{
  color:var(--primary);font-weight:700;cursor:pointer;text-decoration:none;
}
.register-link:hover{text-decoration:underline}

.mode-toggle{
  display:flex;gap:4px;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:12px;padding:4px;margin-bottom:20px;
}
.mode-toggle button{
  flex:1;padding:9px 12px;border-radius:9px;
  font-weight:600;font-size:.85rem;color:var(--text-muted);
  transition:all .15s;cursor:pointer;
}
.mode-toggle button.active{
  background:var(--surface);color:var(--primary);
  box-shadow:var(--shadow-sm);
}
[data-theme="dark"] .mode-toggle button.active{background:var(--surface-2);color:#c4b5fd}

.steps{display:flex;gap:6px;margin-bottom:18px}
.steps .step{flex:1;height:4px;border-radius:4px;background:var(--border);transition:background .25s}
.steps .step.active{background:var(--primary)}
.steps .step.done{background:var(--primary);opacity:.6}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:var(--radius);
  font-weight:600;font-size:.9rem;white-space:nowrap;
  border:1px solid transparent;
  transition:background .15s,border-color .15s,color .15s,transform .08s,box-shadow .15s;
  cursor:pointer;user-select:none;
}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(124,58,237,.3)}
.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--muted-soft);border-color:var(--text-muted)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover:not(:disabled){background:var(--muted-soft);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){background:#b91c1c}
.btn-danger-outline{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn-danger-outline:hover:not(:disabled){background:var(--danger-soft)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover:not(:disabled){background:#047857}
.btn-sm{padding:7px 12px;font-size:.82rem;border-radius:9px}
.btn-lg{padding:13px 22px;font-size:.95rem}
.btn-block{width:100%}
.btn-icon{padding:9px;width:38px;height:38px}

/* ============ APP LAYOUT ============ */
.app{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{
  width:250px;flex-shrink:0;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;height:100dvh;
  z-index:40;
}
.sidebar-header{padding:20px 20px 16px;display:flex;align-items:center;border-bottom:1px solid var(--border-2)}
.nav{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:10px;
  color:var(--text-2);font-weight:500;font-size:.9rem;
  cursor:pointer;transition:background .12s,color .12s;
  position:relative;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:var(--muted-soft);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item.active svg{opacity:1}
[data-theme="dark"] .nav-item.active{color:#c4b5fd}
.nav-item .nav-count{margin-left:auto;background:var(--muted-soft);color:var(--text-2);font-size:.72rem;padding:1px 7px;border-radius:20px;font-weight:600}
.nav-item.active .nav-count{background:var(--primary);color:#fff}
.sidebar-footer{padding:12px;border-top:1px solid var(--border-2)}
.user-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--surface-2);margin-bottom:8px}
.user-avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:.85rem;
}
.user-info{min-width:0;flex:1}
.user-name{font-weight:600;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:.72rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:14px 24px;
  background:rgba(244,245,249,.85);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  min-height:var(--topbar-h);
}
[data-theme="dark"] .topbar{background:rgba(13,13,18,.85)}
.topbar h2{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-actions{display:flex;align-items:center;gap:8px}
.topbar-time{font-size:.82rem;color:var(--text-muted);font-weight:500;padding:0 6px}
.menu-toggle{display:none}
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);position:relative;transition:background .12s,color .12s;
}
.icon-btn:hover{background:var(--muted-soft);color:var(--text)}
.icon-btn svg{width:19px;height:19px}
.icon-btn .badge{
  position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;
  background:var(--danger);color:#fff;font-size:.65rem;font-weight:700;
  border-radius:20px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--surface);
}

/* ============ MAIN TOP TABS ============ */
.main-tabs{
  position:sticky;
  top:var(--topbar-h,62px);
  z-index:25;
  display:flex;gap:10px;
  justify-content:center;
  align-items:center;
  padding:12px 24px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  overflow-x:auto;
  scrollbar-width:none;
}
.main-tabs::-webkit-scrollbar{display:none}
.main-tab{
  flex:0 1 260px;
  min-width:150px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:13px 20px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-2);font-weight:800;font-size:.88rem;
  text-transform:uppercase;letter-spacing:.05em;
  cursor:pointer;transition:all .18s;white-space:nowrap;
  position:relative;
}
.main-tab svg{width:18px;height:18px;flex-shrink:0}
.main-tab:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft-2);transform:translateY(-1px)}
.main-tab.active{
  background:linear-gradient(135deg,var(--primary) 0%,#5b21b6 100%);
  color:#fff;border-color:transparent;
  box-shadow:0 6px 20px rgba(124,58,237,.35);
}
.main-tab.active svg{opacity:1}
.main-tab .tab-count{
  background:rgba(255,255,255,.28);color:#fff;
  padding:2px 9px;border-radius:20px;font-size:.7rem;font-weight:800;
}
.main-tab:not(.active) .tab-count{background:var(--muted-soft);color:var(--text-2)}
@media (max-width:900px){
  .main-tabs{padding:10px 12px;gap:6px}
  .main-tab{flex:1 1 0;min-width:0;padding:11px 8px;font-size:.72rem;gap:5px;letter-spacing:.02em}
  .main-tab svg{width:16px;height:16px}
  .main-tab .tab-count{display:none}
}
@media (max-width:420px){
  .main-tab{padding:10px 6px;font-size:.68rem;gap:4px}
  .main-tab svg{width:14px;height:14px}
}

.content{flex:1;padding:22px 24px 40px;max-width:1600px;width:100%;margin:0 auto}
.section{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm)}
.card-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-title{font-weight:700;font-size:1rem;letter-spacing:-.01em}
.card-sub{font-size:.8rem;color:var(--text-muted);margin-top:2px}

.grid{display:grid;gap:16px}
.grid-stats{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;cursor:pointer;position:relative;transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--primary)}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.stat-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary)}
.stat-icon svg{width:20px;height:20px}
.stat-icon.g{background:var(--success-soft);color:var(--success)}
.stat-icon.r{background:var(--danger-soft);color:var(--danger)}
.stat-icon.y{background:var(--warning-soft);color:var(--warning)}
.stat-icon.b{background:var(--info-soft);color:var(--info)}
.stat-value{font-size:1.8rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat-label{font-size:.82rem;color:var(--text-muted);margin-top:4px}

.hero{background:linear-gradient(135deg,var(--primary) 0%,#5b21b6 100%);color:#fff;border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{content:'';position:absolute;right:60px;bottom:-80px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero-inner{position:relative;z-index:1}
.hero h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.hero-meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:.86rem;opacity:.95}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-status{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px;font-size:.78rem;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.3)}

.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.table{width:100%;border-collapse:collapse;font-size:.86rem}
.table th{text-align:left;padding:12px 14px;font-size:.75rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:12px 14px;border-bottom:1px solid var(--border-2);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table tbody tr{transition:background .1s;cursor:pointer}
.table tbody tr:hover{background:var(--surface-2)}
.td-mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;color:var(--text-2)}
.td-name{font-weight:600;color:var(--text)}
.td-sub{font-size:.76rem;color:var(--text-muted);margin-top:1px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap;background:var(--muted-soft);color:var(--text-2)}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.badge.b-primary{background:var(--primary-soft);color:var(--primary)}
.badge.b-success{background:var(--success-soft);color:var(--success)}
.badge.b-danger{background:var(--danger-soft);color:var(--danger)}
.badge.b-warning{background:var(--warning-soft);color:var(--warning)}
.badge.b-info{background:var(--info-soft);color:var(--info)}
[data-theme="dark"] .badge.b-primary{color:#c4b5fd}
[data-theme="dark"] .badge.b-success{color:#6ee7b7}
[data-theme="dark"] .badge.b-danger{color:#fca5a5}
[data-theme="dark"] .badge.b-warning{color:#fcd34d}
[data-theme="dark"] .badge.b-info{color:#93c5fd}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.toolbar .search{flex:1;min-width:200px;position:relative}
.toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--text-muted);pointer-events:none}
.toolbar .search .input{padding-left:38px}
.select{
  padding:10px 34px 10px 14px;border-radius:var(--radius);
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);cursor:pointer;outline:none;
  appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
  transition:border-color .15s,box-shadow .15s;
}
.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(15,15,25,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;animation:overlayIn .2s ease}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:24px;box-shadow:var(--shadow-lg);animation:modalIn .25s cubic-bezier(.2,.9,.3,1.1)}
.modal-lg{max-width:720px}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.modal-title{font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
.modal-sub{font-size:.83rem;color:var(--text-muted);margin-top:3px}
.modal-body{margin-bottom:18px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal-close{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-muted)}
.modal-close:hover{background:var(--muted-soft);color:var(--text)}

.toast-wrap{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:calc(100vw - 40px)}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:11px;padding:13px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);min-width:260px;max-width:380px;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.1);border-left:3px solid var(--primary)}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.toast.removing{animation:toastOut .25s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
.toast-icon{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:600;font-size:.88rem;margin-bottom:2px}
.toast-msg{font-size:.8rem;color:var(--text-muted);word-break:break-word}
.toast.success{border-left-color:var(--success)}.toast.success .toast-icon{color:var(--success)}
.toast.error{border-left-color:var(--danger)}.toast.error .toast-icon{color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}.toast.warning .toast-icon{color:var(--warning)}
.toast.info{border-left-color:var(--info)}.toast.info .toast-icon{color:var(--info)}

.empty{padding:50px 20px;text-align:center;color:var(--text-muted)}
.empty svg{width:52px;height:52px;opacity:.35;margin-bottom:12px}
.empty-title{font-weight:600;color:var(--text-2);font-size:.95rem;margin-bottom:4px}
.empty-text{font-size:.83rem}

/* ============================================================
   ISSUE (UNIFIED: QR + MANUAL IN ONE BLOCK)
   ============================================================ */
.issue-unified{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  margin-bottom:20px;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  position:relative;
}
.issue-qr-part{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:34px 20px 26px;text-align:center;
  background:
    radial-gradient(circle at 50% 35%, rgba(124,58,237,.18), transparent 62%),
    radial-gradient(circle at 50% 70%, rgba(34,211,238,.10), transparent 65%);
  position:relative;overflow:hidden;
}
.issue-qr-part::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(168,85,247,.08) 50%,transparent 70%);
  animation:qrShine 6s linear infinite;
  pointer-events:none;
}
@keyframes qrShine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.qr-frame{
  position:relative;width:210px;height:210px;padding:16px;border-radius:22px;
  background:rgba(10,4,25,.92);
  box-shadow:
    0 0 0 1px rgba(168,85,247,.55),
    0 0 32px rgba(168,85,247,.5),
    0 0 70px rgba(124,58,237,.28),
    inset 0 0 34px rgba(124,58,237,.22);
  margin-bottom:24px;z-index:1;
}
[data-theme="dark"] .qr-frame{
  background:rgba(3,0,15,.9);
  box-shadow:
    0 0 0 1px rgba(168,85,247,.7),
    0 0 40px rgba(168,85,247,.65),
    0 0 90px rgba(124,58,237,.35),
    inset 0 0 40px rgba(124,58,237,.3);
}
.qr-frame::before,.qr-frame::after{
  content:'';position:absolute;width:28px;height:28px;
  border:3px solid #22d3ee;border-radius:9px;
  box-shadow:0 0 14px #22d3ee,0 0 24px rgba(34,211,238,.6);
  animation:cornerPulse 2.4s ease-in-out infinite;
}
.qr-frame::before{top:-7px;left:-7px;border-right:none;border-bottom:none;border-top-left-radius:12px}
.qr-frame::after{bottom:-7px;right:-7px;border-left:none;border-top:none;border-bottom-right-radius:12px}
@keyframes cornerPulse{
  0%,100%{box-shadow:0 0 10px #22d3ee,0 0 18px rgba(34,211,238,.4)}
  50%{box-shadow:0 0 18px #22d3ee,0 0 34px rgba(34,211,238,.75)}
}
.qr-inner{width:100%;height:100%;position:relative;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.15)}
.qr-inner video{width:100%;height:100%;object-fit:cover;display:block;border-radius:10px}
.qr-inner svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 5px rgba(168,85,247,.95)) drop-shadow(0 0 12px rgba(124,58,237,.6))}
.qr-scan-line{
  position:absolute;left:6px;right:6px;height:3px;
  background:linear-gradient(90deg,transparent 0%,#22d3ee 18%,#a855f7 50%,#22d3ee 82%,transparent 100%);
  box-shadow:0 0 20px #a855f7,0 0 32px #22d3ee,0 0 45px rgba(34,211,238,.7);
  border-radius:3px;
  animation:qrScan 2.8s cubic-bezier(.45,0,.55,1) infinite;
  top:8%;pointer-events:none;
}
@keyframes qrScan{
  0%{top:8%;opacity:0}
  12%{opacity:1}
  88%{opacity:1}
  100%{top:90%;opacity:0}
}
.qr-title{
  font-size:1.4rem;font-weight:800;letter-spacing:-.015em;line-height:1.25;
  margin-bottom:8px;
  background:linear-gradient(135deg,#7c3aed 0%,#22d3ee 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  z-index:1;
}
[data-theme="dark"] .qr-title{
  background:linear-gradient(135deg,#a78bfa 0%,#22d3ee 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.qr-sub{font-size:.88rem;color:var(--text-muted);max-width:360px;z-index:1;line-height:1.5}
.qr-live-dot{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.72rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;
  padding:3px 10px;border-radius:20px;
  background:rgba(34,211,238,.15);color:#0891b2;
  margin-bottom:10px;z-index:1;
}
.qr-live-dot .live-dot{
  width:7px;height:7px;border-radius:50%;background:#ef4444;
  animation:livePulse 1.4s ease-in-out infinite;
}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}

/* PC Scanner block (replaces QR camera on desktop) */
.pc-scanner-block{
  display:flex;flex-direction:column;align-items:center;
  z-index:1;width:100%;max-width:520px;
}
.pc-scanner-icon{
  width:110px;height:110px;border-radius:26px;
  background:linear-gradient(135deg, rgba(124,58,237,.15), rgba(34,211,238,.15));
  border:1px solid rgba(168,85,247,.4);
  display:flex;align-items:center;justify-content:center;
  color:var(--primary);
  margin-bottom:22px;
  box-shadow:0 8px 32px rgba(124,58,237,.22);
  position:relative;
}
[data-theme="dark"] .pc-scanner-icon{
  background:linear-gradient(135deg, rgba(139,92,246,.22), rgba(34,211,238,.14));
  border-color:rgba(168,85,247,.55);
  box-shadow:0 8px 32px rgba(139,92,246,.35);
}
.pc-scanner-icon svg{width:58px;height:58px;position:relative;z-index:1}
.pc-scanner-icon::after{
  content:'';position:absolute;inset:-10px;border-radius:36px;
  border:2px dashed rgba(124,58,237,.4);
  animation:scannerPulse 2.4s ease-in-out infinite;
}
@keyframes scannerPulse{
  0%,100%{opacity:.4;transform:scale(1)}
  50%{opacity:.9;transform:scale(1.05)}
}
#issueScanInput{
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:1rem;
  text-align:center;
  padding:15px 18px;
  letter-spacing:.06em;
  background:var(--surface-2);
  border:2px solid var(--border);
  margin-top:16px;
  width:100%;
  max-width:420px;
  transition:border-color .2s,box-shadow .2s;
  font-weight:600;
}
#issueScanInput:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 4px var(--primary-soft);
  background:var(--surface);
}
#issueScanInput::placeholder{color:var(--text-muted);font-weight:500}

.issue-divider{
  display:flex;align-items:center;gap:14px;
  padding:0 22px;
}
.issue-divider::before,
.issue-divider::after{
  content:'';flex:1;height:1px;background:var(--border);
}
.issue-divider span{
  font-size:.74rem;font-weight:800;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.08em;
  padding:16px 0;white-space:nowrap;
}

.issue-manual-part{
  padding:4px 22px 22px;
}
.manual-step{
  display:flex;gap:14px;align-items:flex-start;
  animation:fadeIn .28s ease;
}
.manual-step + .manual-step{margin-top:16px;padding-top:16px;border-top:1px dashed var(--border)}
.step-badge{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary) 0%,#5b21b6 100%);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.9rem;flex-shrink:0;margin-top:22px;
  box-shadow:0 4px 12px rgba(124,58,237,.3);
}
.step-content{flex:1;min-width:0}
.step-label{
  font-size:.82rem;font-weight:700;
  color:var(--text-2);margin-bottom:8px;
  display:block;
}
#issueLast4{
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:1.3rem;
  letter-spacing:.5em;
  text-align:center;
  font-weight:800;
  padding:16px 14px 16px 26px;
  text-indent:.25em;
}
#issueClientCode{
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:1.3rem;
  letter-spacing:.35em;
  text-align:center;
  font-weight:800;
  padding:16px 14px;
}
.step-error{
  color:var(--danger);font-size:.82rem;margin-top:8px;font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.step-success{
  color:var(--success);font-size:.82rem;margin-top:8px;font-weight:600;
  display:flex;align-items:center;gap:6px;
}

/* ============ RECEPTION (GREEN VISUAL) ============ */
.reception-hero{
  background:linear-gradient(135deg,#10b981 0%,#047857 100%);
  color:#fff;
  border-radius:var(--radius-lg);
  padding:22px 24px;
  margin-bottom:18px;
  display:flex;align-items:center;gap:18px;
  position:relative;overflow:hidden;
  box-shadow:0 10px 28px rgba(16,185,129,.28);
}
.reception-hero::after{
  content:'';position:absolute;right:-50px;top:-50px;
  width:200px;height:200px;border-radius:50%;
  background:rgba(255,255,255,.1);
}
.reception-hero::before{
  content:'';position:absolute;right:60px;bottom:-60px;
  width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,.06);
}
.reception-hero-icon{
  width:58px;height:58px;border-radius:16px;
  background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  backdrop-filter:blur(10px);
  position:relative;z-index:1;
  border:1px solid rgba(255,255,255,.25);
}
.reception-hero-icon svg{width:30px;height:30px;color:#fff}
.reception-hero-text{position:relative;z-index:1;min-width:0}
.reception-hero h2{
  font-size:1.35rem;font-weight:800;letter-spacing:-.02em;
  margin-bottom:4px;
}
.reception-hero p{
  font-size:.86rem;opacity:.92;
}

/* Reception scanner card */
.reception-scanner{
  background:var(--surface);
  border:2px solid #10b981;
  border-radius:var(--radius-lg);
  padding:26px 20px 22px;
  margin-bottom:18px;
  text-align:center;
  position:relative;
  overflow:hidden;
  box-shadow:0 6px 24px rgba(16,185,129,.15);
}
.reception-scanner::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 25%, rgba(16,185,129,.08), transparent 65%);
  pointer-events:none;
}
.barcode-display{
  position:relative;
  width:240px;
  max-width:100%;
  height:92px;
  margin:0 auto 18px;
  padding:14px;
  background:#ecfdf5;
  border-radius:12px;
  border:1px solid #a7f3d0;
  overflow:hidden;
}
[data-theme="dark"] .barcode-display{
  background:#052e22;
  border-color:#065f46;
}
.barcode-display svg{
  width:100%;height:100%;display:block;
  color:#059669;
  filter:drop-shadow(0 0 4px rgba(16,185,129,.4));
}
[data-theme="dark"] .barcode-display svg{color:#34d399}
.barcode-scan-line{
  position:absolute;left:6px;right:6px;height:3px;
  background:linear-gradient(90deg,transparent 0%,#10b981 50%,transparent 100%);
  box-shadow:0 0 14px #10b981,0 0 24px rgba(16,185,129,.7);
  border-radius:3px;
  animation:barcodeScan 2.4s cubic-bezier(.45,0,.55,1) infinite;
  top:10%;
  pointer-events:none;
}
@keyframes barcodeScan{
  0%{top:10%;opacity:0}
  15%{opacity:1}
  85%{opacity:1}
  100%{top:85%;opacity:0}
}
.reception-scan-title{
  font-size:1.1rem;font-weight:800;letter-spacing:-.015em;
  color:#047857;
  margin-bottom:6px;
  position:relative;z-index:1;
}
[data-theme="dark"] .reception-scan-title{color:#34d399}
.reception-scan-sub{
  font-size:.85rem;color:var(--text-muted);
  position:relative;z-index:1;
  max-width:340px;margin:0 auto;
}

.reception-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px;align-items:start;margin-top:20px}
.scan-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.scan-box h3{font-size:.92rem;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:#047857;text-transform:uppercase;letter-spacing:.04em;font-weight:800}
[data-theme="dark"] .scan-box h3{color:#34d399}
.scan-box h3 svg{color:currentColor}
.scan-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.scan-counts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.scan-count{background:#ecfdf5;border-radius:var(--radius);padding:12px 14px;border:1px solid #a7f3d0}
[data-theme="dark"] .scan-count{background:#052e22;border-color:#065f46}
.scan-count .num{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;color:#047857}
[data-theme="dark"] .scan-count .num{color:#34d399}
.scan-count .lbl{font-size:.76rem;color:var(--text-muted)}
.list-items{display:flex;flex-direction:column;gap:8px;max-height:480px;overflow-y:auto;margin-top:14px}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface-2);border-radius:var(--radius);border:1px solid var(--border-2);animation:fadeIn .25s ease;border-left:3px solid #10b981}
.list-item-body{flex:1;min-width:0}
.list-item-title{font-weight:600;font-size:.88rem;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item-sub{font-size:.76rem;color:var(--text-muted);font-family:ui-monospace,monospace}

.order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm)}
.order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.order-num{font-size:1.05rem;font-weight:700;font-family:ui-monospace,monospace;letter-spacing:-.01em}
.order-name{font-size:.95rem;font-weight:600;margin-top:6px}
.order-info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.order-info .info-item .lbl{font-size:.74rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:3px}
.order-info .info-item .val{font-size:.9rem;font-weight:500}
.code-highlight{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-weight:700;font-family:ui-monospace,monospace;letter-spacing:.08em}

.detail-row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border-2);font-size:.87rem}
.detail-row:last-child{border-bottom:none}
.detail-row .lbl{color:var(--text-muted)}
.detail-row .val{font-weight:500;text-align:right;word-break:break-word}

.quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.quick-btn{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);text-align:left;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.quick-btn:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:var(--shadow-md)}
.quick-btn .qi{width:42px;height:42px;border-radius:11px;flex-shrink:0;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center}
.quick-btn .qi svg{width:20px;height:20px}
.quick-btn .qt{font-weight:600;font-size:.9rem}
.quick-btn .qs{font-size:.75rem;color:var(--text-muted);margin-top:1px}

/* ============ BIG EMPTY (RETURNS) ============ */
.big-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 24px;
  background:var(--surface);border:1px dashed var(--border);
  border-radius:var(--radius-lg);
  text-align:center;
  min-height:400px;
  animation:fadeIn .3s ease;
}
.big-empty-icon{
  width:96px;height:96px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary-soft) 0%,var(--primary-soft-2) 100%);
  color:var(--primary);
  margin-bottom:22px;
  box-shadow:0 8px 32px rgba(124,58,237,.18);
  position:relative;
}
.big-empty-icon::after{
  content:'';position:absolute;inset:-8px;border-radius:50%;
  border:2px solid var(--primary-soft);
  opacity:.5;
  animation:emptyPulse 2.6s ease-in-out infinite;
}
@keyframes emptyPulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.06);opacity:.2}}
.big-empty-icon svg{width:46px;height:46px}
.big-empty h2{
  font-size:1.4rem;font-weight:800;letter-spacing:-.02em;
  margin-bottom:10px;color:var(--text);
}
.big-empty p{font-size:.9rem;color:var(--text-muted);max-width:380px;line-height:1.55}

/* ============ EMPLOYEES ============ */
.emp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.emp-head{display:flex;align-items:center;gap:12px}
.emp-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.emp-avatar.inactive{background:var(--muted-soft);color:var(--text-muted)}
.emp-meta{flex:1;min-width:0}
.emp-name{font-weight:700;font-size:.95rem}
.emp-role{font-size:.78rem;color:var(--text-muted)}
.emp-stats{display:flex;gap:8px;flex-wrap:wrap}
.emp-actions{display:flex;gap:8px;flex-wrap:wrap}

.notif-item{display:flex;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:border-color .12s}
.notif-item:hover{border-color:var(--primary)}
.notif-item.unread{background:var(--primary-soft-2);border-color:var(--primary)}
.notif-ic{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.notif-ic.success{background:var(--success-soft);color:var(--success)}
.notif-ic.error{background:var(--danger-soft);color:var(--danger)}
.notif-ic.warning{background:var(--warning-soft);color:var(--warning)}
.notif-ic.info{background:var(--info-soft);color:var(--info)}
.notif-body{flex:1;min-width:0}
.notif-title{font-weight:600;font-size:.88rem}
.notif-text{font-size:.8rem;color:var(--text-muted);margin-top:2px;word-break:break-word}
.notif-time{font-size:.74rem;color:var(--text-muted);margin-top:6px}

.settings-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--border-2)}
.settings-row:last-child{border-bottom:none}
.settings-row .lbl{font-weight:600;font-size:.9rem}
.settings-row .desc{font-size:.78rem;color:var(--text-muted);margin-top:2px}
.settings-row .ctrl{flex-shrink:0}
.switch{position:relative;display:inline-block;width:46px;height:26px}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;cursor:pointer;background:var(--border);border-radius:26px;transition:.2s}
.switch .slider::before{content:'';position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.slider{background:var(--primary)}
.switch input:checked+.slider::before{transform:translateX(20px)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;font-size:.82rem;font-weight:600;color:var(--text-muted);transition:background .12s,color .12s}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
[data-theme="dark"] .seg button.active{background:var(--surface-2);color:var(--text)}

<script>
(function(){
'use strict';

/* ============================================================
   DATA LAYER
   ============================================================ */
const KEYS = {
  orders:'vexa_orders_v3',
  history:'vexa_history_v3',
  employees:'vexa_employees_v3',
  notifications:'vexa_notifications_v3',
  settings:'vexa_settings_v3',
  session:'vexa_session_v3'
};

const DEFAULT_SETTINGS = {
  pvnName:'ПВЗ VEXA',
  theme:'light',
  sound:true,
  uiScale:1
};

/* ------------------------------------------------------------
   DEVICE DETECTION
   ------------------------------------------------------------ */
function isMobileDevice(){
  try{
    return window.matchMedia('(max-width: 900px)').matches;
  }catch(e){
    return window.innerWidth <= 900;
  }
}

function safeParse(str, fallback){
  if(!str) return fallback;
  try{
    const v = JSON.parse(str);
    return v == null ? fallback : v;
  }catch(e){
    console.warn('JSON parse error, using fallback', e);
    return fallback;
  }
}
function lsGet(key, fallback){
  try{ return safeParse(localStorage.getItem(key), fallback); }
  catch(e){ return fallback; }
}
function lsSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ console.warn('localStorage error', e); return false; }
}
function lsRemove(key){
  try{ localStorage.removeItem(key); }catch(e){}
}

function uid(prefix){
  return (prefix||'id') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
}
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtTime(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
}
function fmtDT(iso){ return fmtDate(iso) + ', ' + fmtTime(iso); }
function isToday(iso){
  const d = new Date(iso);
  if(isNaN(d)) return false;
  const t = new Date();
  return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
}
function normalizePhone(p){ return (p||'').replace(/\D/g,''); }
function phoneMatch(a, b){
  const na = normalizePhone(a), nb = normalizePhone(b);
  if(!na || !nb) return false;
  if(na.length < 10 || nb.length < 10) return na === nb;
  return na.slice(-10) === nb.slice(-10);
}
function formatPhoneInput(value){
  let digits = (value||'').replace(/\D/g, '');
  if(digits.startsWith('8')) digits = '7' + digits.slice(1);
  if(digits && !digits.startsWith('7')) digits = '7' + digits;
  digits = digits.slice(0, 11);
  if(!digits) return '';
  let out = '+7';
  const rest = digits.slice(1);
  if(rest.length > 0){ out += ' (' + rest.slice(0, 3); }
  if(rest.length >= 3){ out += ')'; }
  if(rest.length > 3){ out += ' ' + rest.slice(3, 6); }
  if(rest.length > 6){ out += '-' + rest.slice(6, 8); }
  if(rest.length > 8){ out += '-' + rest.slice(8, 10); }
  return out;
}
function attachPhoneFormatter(input, opts){
  if(!input) return;
  opts = opts || {};
  input.addEventListener('input', () => {
    const before = input.value;
    const formatted = formatPhoneInput(before);
    if(formatted !== before) input.value = formatted;
  });
  input.addEventListener('focus', () => {
    if(!input.value && opts.autoStart){ input.value = '+7 ('; }
  });
  input.addEventListener('blur', () => {
    const digits = normalizePhone(input.value);
    if(digits.length <= 1) input.value = '';
  });
}
function formatPhoneDisplay(p){
  const n = normalizePhone(p);
  if(n.length >= 10){
    const d = n.length === 11 && (n[0] === '7' || n[0] === '8') ? n.slice(1) : n.slice(-10);
    return '+7 (' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6,8) + '-' + d.slice(8,10);
  }
  return p;
}

/* ============================================================
   STATUSES & CONSTANTS
   ============================================================ */
const STATUSES = {
  pending_acceptance:{label:'Ожидает приёмки', cls:'b-warning'},
  accepted:{label:'Принят', cls:'b-info'},
  in_stock:{label:'На складе', cls:'b-info'},
  awaiting_pickup:{label:'Ожидает выдачи', cls:'b-primary'},
  issued:{label:'Выдан', cls:'b-success'},
  returned:{label:'Возврат', cls:'b-danger'},
  cancelled:{label:'Отменён', cls:''}
};
const ROLE_OPTIONS = ['Администратор', 'Старший сотрудник', 'Сотрудник'];
const RETURN_REASONS = ['Не подошёл товар', 'Повреждение', 'Ошибка комплектации', 'Другая причина'];

/* ============================================================
   STATE
   ============================================================ */
const state = {
  orders: [],
  history: [],
  employees: [],
  notifications: [],
  settings: Object.assign({}, DEFAULT_SETTINGS),
  currentUser: null,
  currentSection: 'issue',
  sidebarOpen: false,
  loginMode: 'phone',
  reception: {items:[], errors:0},
  issueLookup: {last4:'', orderId:null, code:''},
  register: {step: 1, phone: '', login: '', password: '', firstName: '', lastName: ''},
  filters: {
    warehouse: {q:'', status:'all'},
    history: {q:'', type:'all', sort:'time-desc'},
    returns: {q:''},
    notifications: {showUnread:false}
  }
};

function loadState(){
  let orders = lsGet(KEYS.orders, []);
  let history = lsGet(KEYS.history, []);
  let employees = lsGet(KEYS.employees, []);
  let notifications = lsGet(KEYS.notifications, []);
  let settings = lsGet(KEYS.settings, null);

  if(!Array.isArray(orders)) orders = [];
  if(!Array.isArray(history)) history = [];
  if(!Array.isArray(employees)) employees = [];
  if(!Array.isArray(notifications)) notifications = [];

  if(!settings || typeof settings !== 'object') settings = Object.assign({}, DEFAULT_SETTINGS);
  settings = Object.assign({}, DEFAULT_SETTINGS, settings);

  state.orders = orders;
  state.history = history;
  state.employees = employees;
  state.notifications = notifications;
  state.settings = settings;

  const session = lsGet(KEYS.session, null);
  if(session && session.employeeId){
    const emp = employees.find(e => e.id === session.employeeId);
    if(emp && emp.active) state.currentUser = emp.id;
  }
}
function saveOrders(){ lsSet(KEYS.orders, state.orders); }
function saveHistory(){ lsSet(KEYS.history, state.history); }
function saveEmployees(){ lsSet(KEYS.employees, state.employees); }
function saveNotifications(){ lsSet(KEYS.notifications, state.notifications); }
function saveSettings(){ lsSet(KEYS.settings, state.settings); }
function saveSession(){
  if(state.currentUser) lsSet(KEYS.session, {employeeId: state.currentUser});
  else lsRemove(KEYS.session);
}

function getUser(id){ return state.employees.find(e => e.id === id) || null; }
function currentUserObj(){ return getUser(state.currentUser); }

/* ============================================================
   HISTORY / NOTIFICATIONS
   ============================================================ */
function addHistory(type, orderNumber, result, info){
  state.history.unshift({
    id: uid('h'),
    timestamp: nowISO(),
    type, orderNumber,
    employee: state.currentUser,
    result,
    info: info || ''
  });
  if(state.history.length > 2000) state.history.length = 2000;
  saveHistory();
}
function pushNotification(type, title, message){
  state.notifications.unshift({
    id: uid('n'),
    timestamp: nowISO(),
    type, title, message,
    read:false
  });
  if(state.notifications.length > 200) state.notifications.length = 200;
  saveNotifications();
  updateNotifBadge();
}
function unreadCount(){ return state.notifications.filter(n => !n.read).length; }
function updateNotifBadge(){
  const badge = document.getElementById('notifBadge');
  if(!badge) return;
  const c = unreadCount();
  if(c > 0){ badge.textContent = c > 99 ? '99+' : String(c); badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}

/* ============================================================
   TOASTS
   ============================================================ */
const ICONS = {
  success:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  error:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
  warning:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
};

let audioCtx = null;
function beep(type){
  if(!state.settings.sound) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    if(type === 'success') o.frequency.value = 880;
    else if(type === 'error') o.frequency.value = 220;
    else o.frequency.value = 550;
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    o.start(); o.stop(audioCtx.currentTime + 0.2);
  }catch(e){}
}

function toast(message, type, title){
  type = type || 'info';
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const titles = {success:'Готово', error:'Ошибка', warning:'Внимание', info:'Информация'};
  el.innerHTML = `
    <span class="toast-icon">${ICONS[type] || ICONS.info}</span>
    <div class="toast-body">
      <div class="toast-title">${escapeHtml(title || titles[type])}</div>
      <div class="toast-msg">${escapeHtml(message)}</div>
    </div>`;
  wrap.appendChild(el);
  beep(type);
  setTimeout(() => {
    el.classList.add('removing');
    setTimeout(() => el.remove(), 260);
  }, 3600);
}

/* ============================================================
   UTILS
   ============================================================ */
function escapeHtml(s){
  if(s == null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function statusBadge(status){
  const s = STATUSES[status] || {label: status, cls:''};
  return `<span class="badge ${s.cls}">${escapeHtml(s.label)}</span>`;
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  return ((parts[0]||'')[0]||'') + ((parts[1]||'')[0]||'');
}
function initialsUpper(name){ return initials(name).toUpperCase(); }

/* ============================================================
   QR / BARCODE SVG
   ============================================================ */
function generateQRsvg(){
  const size = 25;
  let path = '';
  let seed = 137;
  const rnd = () => {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  };
  const isFinder = (x, y) => {
    return (x < 7 && y < 7) || (x >= size-7 && y < 7) || (x < 7 && y >= size-7);
  };
  for(let y = 0; y < size; y++){
    for(let x = 0; x < size; x++){
      if(isFinder(x,y)) continue;
      if(rnd() > 0.52){
        path += `M${x} ${y}h1v1h-1z `;
      }
    }
  }
  const finder = (ox, oy) => {
    let d = `M${ox} ${oy}h7v7h-7z M${ox+1} ${oy+1}h5v5h-5z `;
    d += `M${ox+2} ${oy+2}h3v3h-3z `;
    return `<path d="${d}" fill="currentColor" fill-rule="evenodd"/>`;
  };
  return `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
    <path d="${path}" fill="currentColor"/>
    ${finder(0,0)}
    ${finder(size-7,0)}
    ${finder(0,size-7)}
  </svg>`;
}
function generateBarcodeSvg(){
  let path = '';
  let x = 0;
  let seed = 887;
  const rnd = () => {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  };
  for(let i = 0; i < 60; i++){
    const w = 1 + Math.floor(rnd() * 3);
    const gap = 1 + Math.floor(rnd() * 2);
    path += `<rect x="${x}" y="0" width="${w}" height="100" fill="currentColor"/>`;
    x += w + gap;
  }
  return `<svg viewBox="0 0 ${x} 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${path}</svg>`;
}

/* ============================================================
   MODAL SYSTEM
   ============================================================ */
let modalStack = [];
function openModal(opts){
  const root = document.getElementById('modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const sizeCls = opts.size === 'lg' ? 'modal-lg' : '';
  overlay.innerHTML = `
    <div class="modal ${sizeCls}" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div>
          <div class="modal-title">${escapeHtml(opts.title || '')}</div>
          ${opts.subtitle ? `<div class="modal-sub">${escapeHtml(opts.subtitle)}</div>` : ''}
        </div>
        <button class="modal-close" data-close aria-label="Закрыть">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">${opts.body || ''}</div>
      <div class="modal-footer" data-footer></div>
    </div>`;
  root.appendChild(overlay);

  const modal = overlay.querySelector('.modal');
  const footer = modal.querySelector('[data-footer]');
  const actions = opts.actions || [{label:'Закрыть', cls:'btn-secondary', onClick: closeModal}];
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.cls || 'btn-secondary');
    b.textContent = a.label;
    b.addEventListener('click', () => {
      if(a.onClick){
        const r = a.onClick(overlay);
        if(r === false) return;
      }
      if(a.close !== false) closeModal();
    });
    footer.appendChild(b);
  });

  function closeThis(){
    overlay.style.animation = 'overlayIn .18s ease reverse forwards';
    setTimeout(() => {
      overlay.remove();
      modalStack = modalStack.filter(m => m !== overlay);
      if(opts.onClose) opts.onClose();
    }, 160);
  }
  overlay._close = closeThis;
  overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeThis));
  overlay.addEventListener('mousedown', e => { if(e.target === overlay) closeThis(); });
  document.addEventListener('keydown', escHandler);
  function escHandler(e){
    if(e.key === 'Escape'){
      document.removeEventListener('keydown', escHandler);
      closeThis();
    }
  }
  const phoneInModal = overlay.querySelector('input[type="tel"]');
  if(phoneInModal) attachPhoneFormatter(phoneInModal, {autoStart:true});

  modalStack.push(overlay);
  return overlay;
}
function closeModal(){
  if(modalStack.length === 0) return;
  const top = modalStack[modalStack.length - 1];
  if(top && top._close) top._close();
  else modalStack.pop();
}
function confirmDialog(title, message, onConfirm, opts){
  opts = opts || {};
  openModal({
    title,
    body:`<p style="color:var(--text-2)">${escapeHtml(message)}</p>`,
    actions:[
      {label: opts.cancelLabel || 'Отмена', cls:'btn-secondary'},
      {label: opts.confirmLabel || 'Подтвердить', cls: opts.danger ? 'btn-danger' : 'btn-primary', onClick: onConfirm}
    ]
  });
}

function navigate(section){
  if(!ALL_SECTIONS.some(s => s.id === section)) section = 'home';
  stopIssueAutoScanner();

  closeSidebar();
  render();

function computeStats(){
  const today = new Date();
  const startOfDay = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
  const awaitingPickup = state.orders.filter(o => o.status === 'awaiting_pickup').length;
  const acceptedToday = state.orders.filter(o => o.acceptedAt && new Date(o.acceptedAt).getTime() >= startOfDay).length;
  const issuedToday = state.orders.filter(o => o.issuedAt && new Date(o.issuedAt).getTime() >= startOfDay).length;
  const returnsToday = state.orders.filter(o => o.returnedAt && new Date(o.returnedAt).getTime() >= startOfDay).length;
  const inStock = state.orders.filter(o => ['in_stock','awaiting_pickup','accepted'].includes(o.status)).length;
  const operationsToday = state.history.filter(h => new Date(h.timestamp).getTime() >= startOfDay).length;
  return {awaitingPickup, acceptedToday, issuedToday, returnsToday, inStock, operationsToday};
}

function handleReceptionAdd(){
  const input = document.getElementById('recvBarcode');
  if(!input) return;
  const code = input.value.trim();
  if(!code){ toast('Введите штрихкод товара', 'warning'); return; }
  const order = state.orders.find(o => o.barcode === code);
  if(!order){
    state.reception.errors++;
    toast('Товар со штрихкодом ' + code + ' не найден.', 'error');
    render();
    return;
  }
  if(order.status === 'issued'){
    state.reception.errors++;
    toast('Заказ ' + order.number + ' уже выдан', 'error');
    render();
    return;
  }
  if(state.reception.items.some(i => i.id === order.id)){
    state.reception.errors++;
    toast('Товар уже в списке приёмки', 'warning');
    render();
    return;
  }
  state.reception.items.push({
    id: order.id, number: order.number, product: order.product, barcode: order.barcode, status: order.status
  });
  toast('Товар «' + order.product + '» добавлен', 'success');
  render();
  const ni = document.getElementById('recvBarcode');
  if(ni) ni.focus();
}

function completeReception(){
  if(state.reception.items.length === 0){ toast('Список приёмки пуст', 'warning'); return; }
  const supply = (document.getElementById('recvSupply')||{}).value || '';
  let count = 0;
  state.reception.items.forEach(it => {
    const o = state.orders.find(x => x.id === it.id);
    if(!o || o.status === 'issued') return;
    o.status = 'in_stock';
    o.acceptedAt = nowISO();
    o.shelf = o.shelf || nextShelf();
    o.employee = state.currentUser;
    count++;
    addHistory('Приёмка', o.number, 'Успешно',
      'Товар принят' + (supply ? ' (поставка ' + supply + ')' : '') + ', полка ' + o.shelf);
  });
  saveOrders();
  pushNotification('success', 'Приёмка завершена', 'Принято товаров: ' + count);
  state.reception.items = [];
  state.reception.errors = 0;
  toast('Приёмка завершена: ' + count, 'success');
  render();
}

function cancelReception(){
  if(state.reception.items.length === 0) return;
  confirmDialog('Отменить приёмку?', 'Все добавленные товары будут убраны из списка.', () => {
    state.reception.items = [];
    state.reception.errors = 0;
    toast('Приёмка отменена', 'info');
    render();
  });
}

function nextShelf(){
  const shelves = ['A-01','A-02','A-03','B-01','B-02','B-03','C-01','C-02','C-03','D-01','D-02','D-03','E-01','E-02','E-03'];
  return shelves[Math.floor(Math.random() * shelves.length)];
}

/* ============================================================
   ISSUE AUTO-SCANNER (live camera, only on mobile)
   ============================================================ */
let issueScannerActive = false;
let issueScannerStream = null;
let issueScannerRAF = null;
let issueScannerCooldown = false;

function loadJsQR(){
  return new Promise((resolve, reject) => {
    if(window.jsQR) return resolve(window.jsQR);
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    s.onload = () => resolve(window.jsQR);
    s.onerror = () => reject(new Error('jsQR load failed'));
    document.head.appendChild(s);
  });
}

function stopIssueAutoScanner(){
  issueScannerActive = false;
  if(issueScannerRAF){
    cancelAnimationFrame(issueScannerRAF);
    issueScannerRAF = null;
  }
  if(issueScannerStream){
    try{ issueScannerStream.getTracks().forEach(t => t.stop()); }catch(e){}
    issueScannerStream = null;
  }
}

async function startIssueAutoScanner(){
  stopIssueAutoScanner();
  if(state.currentSection !== 'issue') return;
  if(!isMobileDevice()) return;
  if(issueScannerCooldown) return;

  const qrInner = document.getElementById('issueQrInner');
  if(!qrInner) return;

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return;
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
  } catch(e){
    console.warn('Camera not available:', e);
    return;
  }

  if(state.currentSection !== 'issue' || !isMobileDevice()){
    try{ stream.getTracks().forEach(t => t.stop()); }catch(e){}
    return;
  }

  issueScannerActive = true;
  issueScannerStream = stream;

  qrInner.innerHTML = '';
  qrInner.style.background = '#000';

  const video = document.createElement('video');
  video.setAttribute('autoplay', '');
  video.setAttribute('playsinline', '');
  video.setAttribute('muted', '');
  video.muted = true;
  qrInner.appendChild(video);
  video.srcObject = stream;

  const liveDot = document.getElementById('issueLiveDot');
  if(liveDot) liveDot.style.display = 'inline-flex';

  try { await video.play(); } catch(e){}

  let nativeDetector = null;
  if('BarcodeDetector' in window){
    try {
      nativeDetector = new window.BarcodeDetector({
        formats: ['qr_code', 'code_128', 'code_39', 'ean_13']
      });
    } catch(e){ nativeDetector = null; }
  }

  let jsQR = null;
  if(!nativeDetector){
    try { jsQR = await loadJsQR(); } catch(e){}
  }

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  let frameCounter = 0;

  const scanLoop = async () => {
    if(!issueScannerActive) return;
    if(!video.parentNode) return;

    let code = null;

    try {
      if(nativeDetector){
        const codes = await nativeDetector.detect(video);
        if(codes && codes.length > 0 && codes[0].rawValue){
          code = codes[0].rawValue;
        }
      } else if(jsQR && video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0){
        frameCounter++;
        if(frameCounter % 3 === 0){
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const result = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: 'dontInvert'
          });
          if(result && result.data){ code = result.data; }
        }
      }
    } catch(e){ /* ignore */ }

    if(code){
      handleIssueScanResult(code);
      return;
    }

    issueScannerRAF = requestAnimationFrame(scanLoop);
  };

  issueScannerRAF = requestAnimationFrame(scanLoop);
}

function handleIssueScanResult(code){
  stopIssueAutoScanner();
  issueScannerCooldown = true;

  const q = String(code).trim();
  const qLower = q.toLowerCase();
  const digits = q.replace(/\D/g,'');

  let order = state.orders.find(o =>
    (o.number||'').toLowerCase() === qLower ||
    (o.barcode||'').toLowerCase() === qLower ||
    (o.pickupCode||'') === q
  );

  if(!order){
    order = state.orders.find(o => (o.pickupCode||'') && q.includes(o.pickupCode));
  }

  if(!order && digits.length >= 4){
    const last4 = digits.slice(-4);
    const byLast4 = findOrdersByLast4(last4);
    if(byLast4.length === 1) order = byLast4[0];
  }

  const resEl = document.getElementById('issueResult');
  const scanInput = document.getElementById('issueScanInput');
  if(scanInput) scanInput.value = '';

  if(!order){
    if(resEl) resEl.innerHTML = `
      <div class="order-card" style="margin-top:16px;border-left:4px solid var(--danger)">
        <div style="display:flex;align-items:center;gap:14px">
          <div style="width:46px;height:46px;border-radius:50%;background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:800;font-size:1.1rem;color:var(--danger)">Товар не найден</div>
            <div style="font-size:.8rem;color:var(--text-muted);margin-top:4px;word-break:break-all">Отсканирован код: <b>${escapeHtml(q)}</b></div>
          </div>
        </div>
      </div>`;
    toast('Товар не найден', 'error');
    beep('error');
    setTimeout(() => {
      issueScannerCooldown = false;
      if(state.currentSection === 'issue'){
        const resEl2 = document.getElementById('issueResult');
        if(resEl2) resEl2.innerHTML = '';
        if(isMobileDevice()){
          startIssueAutoScanner();
        } else {
          const inp = document.getElementById('issueScanInput');
          if(inp){ inp.value = ''; inp.focus(); }
        }
      }
    }, 2500);
    return;
  }

  if(resEl) resEl.innerHTML = renderIssueResultForOrder(order, true);
  bindIssueConfirm();
  toast('Заказ ' + order.number + ' найден', 'success');
  beep('success');

  setTimeout(() => {
    issueScannerCooldown = false;
    if(!isMobileDevice() && state.currentSection === 'issue'){
      const inp = document.getElementById('issueScanInput');
      if(inp) inp.focus();
    }
  }, 2000);
}

      {label:'Отмена', cls:'btn-secondary'},
      {label:'Выдать', cls:'btn-primary', close:false, onClick: (overlay) => {
        const val = (overlay.querySelector('#confirmCode').value || '').trim();
        if(val !== order.pickupCode){
          toast('Неверный код получения', 'error');
          pushNotification('error', 'Неверный код', 'Заказ ' + order.number);
          return false;
        }
        performIssue(order.id);
        closeModal();
      }}
    ]
  });
  setTimeout(() => { const el = document.getElementById('confirmCode'); if(el) el.focus(); }, 60);
}

function performIssue(orderId){
  const order = state.orders.find(o => o.id === orderId);
  if(!order) return;
  if(order.status === 'issued'){ toast('Заказ уже выдан', 'error'); return; }
  order.status = 'issued';
  order.issuedAt = nowISO();
  order.employee = state.currentUser;
  saveOrders();
  addHistory('Выдача', order.number, 'Успешно', 'Заказ выдан клиенту');
  pushNotification('success', 'Заказ выдан', order.number + ' · ' + order.product);
  toast('Заказ ' + order.number + ' выдан', 'success');
  state.issueLookup = {last4:'', orderId:null, code:''};
  issueScannerCooldown = false;
  stopIssueAutoScanner();
  render();
}

          <input class="input" id="returnSearch" placeholder="Номер заказа, штрихкод или код" autocomplete="off">
        </div>

      </div>
      <div id="returnResult" style="margin-top:18px"></div>

        </div>

        `<div class="table-wrap" style="border:none;background:transparent">
          <table class="table">
            <thead><tr>
              <th>Заказ</th><th>Товар</th><th>Причина</th><th>Дата</th><th>Сотрудник</th>
            </tr></thead>
            <tbody>
              ${filtered.map(o => {

                  <td class="td-name">${escapeHtml(o.product)}</td>

function renderReturnResult(query){
  const container = document.getElementById('returnResult');
  if(!container) return;
  if(!query){ container.innerHTML = ''; return; }
  const order = state.orders.find(o =>
    o.number.toLowerCase() === query.toLowerCase() ||
    o.barcode.toLowerCase() === query.toLowerCase() ||
    o.pickupCode === query
  );
  if(!order){
    container.innerHTML = `<div class="empty"><div class="empty-title">Заказ не найден</div><div class="empty-text">Проверьте введённые данные</div></div>`;
    return;
  }
  if(order.status === 'returned'){
    container.innerHTML = `<div class="order-card">
      <div class="order-head">
        <div><div class="order-num">${escapeHtml(order.number)}</div><div class="order-name">${escapeHtml(order.product)}</div></div>
        ${statusBadge(order.status)}
      </div>
      <div style="padding:12px;border-radius:var(--radius);background:var(--danger-soft);color:var(--danger);font-size:.85rem;font-weight:600">
        Возврат уже оформлен ${escapeHtml(fmtDT(order.returnedAt))} · ${escapeHtml(order.returnReason || '—')}
      </div></div>`;
    return;
  }
  if(order.status === 'issued'){
    container.innerHTML = `<div class="order-card">
      <div class="order-head">
        <div><div class="order-num">${escapeHtml(order.number)}</div><div class="order-name">${escapeHtml(order.product)}</div></div>
        ${statusBadge(order.status)}
      </div>
      <div style="padding:12px;border-radius:var(--radius);background:var(--warning-soft);color:var(--warning);font-size:.85rem;font-weight:600">
        Заказ уже выдан — возврат недоступен
      </div></div>`;
    return;
  }
  if(order.status === 'cancelled'){
    container.innerHTML = `<div class="order-card"><div style="padding:12px;color:var(--text-muted)">Заказ отменён</div></div>`;
    return;
  }
  container.innerHTML = `
    <div class="order-card">
      <div class="order-head">
        <div><div class="order-num">${escapeHtml(order.number)}</div><div class="order-name">${escapeHtml(order.product)}</div></div>
        ${statusBadge(order.status)}
      </div>
      <div class="order-info">
        <div class="info-item"><div class="lbl">Штрихкод</div><div class="val" style="font-family:ui-monospace,monospace;font-size:.82rem">${escapeHtml(order.barcode)}</div></div>
        <div class="info-item"><div class="lbl">Полка</div><div class="val">${escapeHtml(order.shelf || '—')}</div></div>
      </div>
      <div class="form-group">
        <label for="returnReason">Причина возврата</label>
        <select class="select" id="returnReason" style="width:100%">
          ${RETURN_REASONS.map(r => `<option>${escapeHtml(r)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label for="returnComment">Комментарий</label>
        <textarea class="input" id="returnComment" placeholder="Необязательно"></textarea>
      </div>
      <button class="btn btn-danger btn-block" id="returnConfirmBtn">Оформить возврат</button>
    </div>`;
  const btn = document.getElementById('returnConfirmBtn');
  if(btn) btn.addEventListener('click', () => {
    const reason = document.getElementById('returnReason').value;
    const comment = document.getElementById('returnComment').value.trim();
    openModal({
      title:'Подтвердить возврат',
      subtitle:'Заказ ' + order.number,
      body:`
        <div class="detail-row"><span class="lbl">Товар</span><span class="val">${escapeHtml(order.product)}</span></div>
        <div class="detail-row"><span class="lbl">Причина</span><span class="val">${escapeHtml(reason)}</span></div>
        ${comment ? `<div class="detail-row"><span class="lbl">Комментарий</span><span class="val">${escapeHtml(comment)}</span></div>` : ''}`,
      actions:[
        {label:'Отмена', cls:'btn-secondary'},
        {label:'Оформить', cls:'btn-danger', onClick: () => performReturn(order.id, reason, comment)}
      ]
    });
  });
}

function performReturn(orderId, reason, comment){
  const order = state.orders.find(o => o.id === orderId);
  if(!order) return;
  if(order.status === 'returned'){ toast('Возврат уже оформлен', 'warning'); return; }
  order.status = 'returned';
  order.returnedAt = nowISO();
  order.returnReason = reason;
  order.returnComment = comment || null;
  order.employee = state.currentUser;
  saveOrders();
  addHistory('Возврат', order.number, 'Оформлен', 'Причина: ' + reason + (comment ? ' · ' + comment : ''));
  pushNotification('warning', 'Оформлен возврат', order.number + ' · ' + order.product);
  toast('Возврат по заказу ' + order.number + ' оформлен', 'success');
  render();
}

/* ============ WAREHOUSE ============ */
function renderWarehouse(){
  const f = state.filters.warehouse;
  let list = state.orders.slice();
  if(f.status === 'awaiting') list = list.filter(o => o.status === 'awaiting_pickup');
  else if(f.status === 'today') list = list.filter(o => o.acceptedAt && isToday(o.acceptedAt));
  else if(f.status === 'returned') list = list.filter(o => o.status === 'returned');
  else if(f.status === 'issued') list = list.filter(o => o.status === 'issued');
  else if(f.status === 'stock') list = list.filter(o => ['in_stock','accepted','awaiting_pickup'].includes(o.status));

  if(f.q){
    const q = f.q.toLowerCase();
    list = list.filter(o =>
      o.number.toLowerCase().includes(q) ||
      o.barcode.toLowerCase().includes(q) ||
      o.product.toLowerCase().includes(q) ||
      (o.shelf || '').toLowerCase().includes(q)
    );
  }
  list.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  return `
  <div class="section">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="input" id="whSearch" placeholder="Номер, штрихкод, название или полка" value="${escapeHtml(f.q)}">
      </div>
      <select class="select" id="whStatus">
        <option value="all" ${f.status==='all'?'selected':''}>Все товары</option>
        <option value="awaiting" ${f.status==='awaiting'?'selected':''}>Ожидают выдачи</option>
        <option value="today" ${f.status==='today'?'selected':''}>Принятые сегодня</option>
        <option value="stock" ${f.status==='stock'?'selected':''}>На складе</option>
        <option value="returned" ${f.status==='returned'?'selected':''}>Возвраты</option>
        <option value="issued" ${f.status==='issued'?'selected':''}>Выданные</option>
      </select>
      <div style="margin-left:auto;color:var(--text-muted);font-size:.82rem;align-self:center">${list.length} позиций</div>
    </div>

    ${list.length === 0 ? emptyState('Ничего не найдено', 'Измените запрос или фильтр') :
      `<div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th>Заказ</th><th>Товар</th><th>Штрихкод</th><th>Статус</th><th>Полка</th><th>Поступление</th><th>Сотрудник</th>
          </tr></thead>
          <tbody>
            ${list.map(o => {
              const u = getUser(o.employee);
              return `<tr data-order-details="${o.id}">
                <td class="td-mono">${escapeHtml(o.number)}</td>
                <td class="td-name">${escapeHtml(o.product)}<div class="td-sub">${escapeHtml(o.category||'—')}</div></td>
                <td class="td-mono">${escapeHtml(o.barcode)}</td>
                <td>${statusBadge(o.status)}</td>
                <td class="td-mono">${escapeHtml(o.shelf || '—')}</td>
                <td>${escapeHtml(fmtDate(o.acceptedAt || o.createdAt))}</td>
                <td>${escapeHtml(u ? u.name : '—')}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`}
  </div>`;
}

  openModal({
    title: 'Новый заказ',
    subtitle: 'Заполните данные товара',
    size: 'lg',
    body: `
      <div class="form-group">
        <label>Номер заказа *</label>
        <input class="input" id="newOrderNum" placeholder="Номер заказа" autofocus>
      </div>
      <div class="form-group">
        <label>Название товара *</label>
        <input class="input" id="newOrderProduct" placeholder="Название товара">
      </div>
      <div class="form-group">
        <label>Категория</label>
        <input class="input" id="newOrderCategory" placeholder="Категория">
      </div>
      <div class="form-group">
        <label>Штрихкод *</label>
        <input class="input" id="newOrderBarcode" placeholder="Штрихкод товара">
      </div>
      <div class="form-group">
        <label>Код получения</label>
        <input class="input" id="newOrderPickup" placeholder="Код получения" inputmode="numeric" maxlength="6">
      </div>
      <div class="form-group">
        <label>Количество</label>
        <input class="input" type="number" id="newOrderQty" value="1" min="1">
      </div>
      <div class="form-group">
        <label>Начальный статус</label>
        <select class="select" id="newOrderStatus" style="width:100%">
          <option value="pending_acceptance">Ожидает приёмки</option>
          <option value="awaiting_pickup">Ожидает выдачи (уже на ПВЗ)</option>
        </select>
      </div>
    `,
    actions: [
      {label: 'Отмена', cls: 'btn-secondary'},
      {label: 'Создать', cls: 'btn-primary', close: false, onClick: (overlay) => {
        const num = overlay.querySelector('#newOrderNum').value.trim();
        const product = overlay.querySelector('#newOrderProduct').value.trim();
        const barcode = overlay.querySelector('#newOrderBarcode').value.trim();
        const category = overlay.querySelector('#newOrderCategory').value.trim() || '—';
        const pickupCode = overlay.querySelector('#newOrderPickup').value.trim() || String(100000 + Math.floor(Math.random()*900000));
        const qty = Math.max(1, parseInt(overlay.querySelector('#newOrderQty').value) || 1);
        const status = overlay.querySelector('#newOrderStatus').value;

        if(!num || !product || !barcode){
          toast('Заполните обязательные поля', 'warning');
          return false;
        }
        if(state.orders.some(o => o.number.toLowerCase() === num.toLowerCase())){
          toast('Заказ с таким номером уже существует', 'error');
          return false;
        }
        if(state.orders.some(o => o.barcode === barcode)){
          toast('Товар с таким штрихкодом уже существует', 'error');
          return false;
        }

        const o = {
          id: uid('o'),
          number: num,
          product,
          category,
          barcode,
          pickupCode,
          status,
          quantity: qty,
          createdAt: nowISO(),
          acceptedAt: status === 'awaiting_pickup' ? nowISO() : null,
          issuedAt: null,
          returnedAt: null,
          shelf: status === 'awaiting_pickup' ? nextShelf() : null,
          employee: status === 'awaiting_pickup' ? state.currentUser : null,
          returnReason: null,
          returnComment: null,
          customer: ''
        };
        state.orders.unshift(o);
        saveOrders();

        if(status === 'awaiting_pickup'){
          addHistory('Приёмка', o.number, 'Успешно', 'Товар добавлен вручную на полку ' + o.shelf);
        }

        toast('Заказ ' + o.number + ' добавлен', 'success');
        pushNotification('success', 'Создан заказ', o.number + ' · ' + o.product);
        closeModal();
        render();
      }}
    ]
  });
}

/* ============ ORDER DETAILS ============ */

      </div>
