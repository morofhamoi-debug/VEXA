      <div class="detail-row"><span class="lbl">Количество</span><span class="val">${o.quantity} шт.</span></div>
      <div class="detail-row"><span class="lbl">Штрихкод</span><span class="val" style="font-family:ui-monospace,monospace">${escapeHtml(o.barcode)}</span></div>
      <div class="detail-row"><span class="lbl">Место хранения</span><span class="val">${escapeHtml(o.shelf || '—')}</span></div>
      <div class="detail-row"><span class="lbl">Создан</span><span class="val">${escapeHtml(fmtDT(o.createdAt))}</span></div>
      ${o.acceptedAt ? `<div class="detail-row"><span class="lbl">Принят</span><span class="val">${escapeHtml(fmtDT(o.acceptedAt))}</span></div>` : ''}
      ${o.issuedAt ? `<div class="detail-row"><span class="lbl">Выдан</span><span class="val">${escapeHtml(fmtDT(o.issuedAt))}</span></div>` : ''}
      ${o.returnedAt ? `<div class="detail-row"><span class="lbl">Возврат</span><span class="val">${escapeHtml(fmtDT(o.returnedAt))}</span></div>` : ''}
      ${o.returnReason ? `<div class="detail-row"><span class="lbl">Причина возврата</span><span class="val">${escapeHtml(o.returnReason)}</span></div>` : ''}
      <div class="detail-row"><span class="lbl">Сотрудник</span><span class="val">${escapeHtml(u ? u.name : '—')}</span></div>
      <div style="margin-top:18px">
        <div style="font-weight:700;font-size:.9rem;margin-bottom:10px">История по заказу</div>
        ${hist.length === 0 ? '<div style="color:var(--text-muted);font-size:.85rem">Нет записей</div>' :
          hist.map(h => `<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-2);font-size:.83rem">
            <div style="color:var(--text-muted);font-family:ui-monospace,monospace;flex-shrink:0">${escapeHtml(fmtTime(h.timestamp))}</div>
            <div style="flex:1"><b>${escapeHtml(h.type)}</b> · ${escapeHtml(h.result)}<div style="color:var(--text-muted);font-size:.78rem;margin-top:2px">${escapeHtml(h.info)}</div></div>
          </div>`).join('')}
      </div>
      ${o.status !== 'issued' && o.status !== 'returned' && o.status !== 'cancelled' && o.shelf ? `
        <div style="margin-top:18px;padding-top:18px;border-top:1px solid var(--border-2)">
          <div style="font-weight:700;font-size:.9rem;margin-bottom:10px">Переместить на полку</div>
          <div style="display:flex;gap:10px">
            <input class="input" id="moveShelfInput" placeholder="Полка" value="${escapeHtml(o.shelf)}" style="flex:1">
            <button class="btn btn-primary" id="moveShelfBtn">Сохранить</button>
          </div>
        </div>` : ''}
    `,
    actions:[{label:'Закрыть', cls:'btn-secondary'}]
  });
  const moveBtn = document.getElementById('moveShelfBtn');
  if(moveBtn){
    moveBtn.addEventListener('click', () => {
      const val = (document.getElementById('moveShelfInput').value || '').trim();
      if(!val){ toast('Введите полку', 'warning'); return; }
      if(val === o.shelf){ toast('Полка не изменилась', 'info'); return; }
      const old = o.shelf || '—';
      o.shelf = val;
      saveOrders();
      addHistory('Перемещение', o.number, 'Успешно', 'Полка: ' + old + ' → ' + val);
      pushNotification('info', 'Товар перемещён', o.number + ' · ' + old + ' → ' + val);
      toast('Полка обновлена', 'success');
      closeModal();
      render();
    });
  }
}

/* ============ HISTORY ============ */

  const f = state.filters.history;
  let list = state.history.slice();
  if(f.type !== 'all') list = list.filter(h => h.type === f.type);
  if(f.q){
    const q = f.q.toLowerCase();
    list = list.filter(h =>
      h.orderNumber.toLowerCase().includes(q) ||
      (h.info||'').toLowerCase().includes(q) ||
      ((getUser(h.employee)||{}).name||'').toLowerCase().includes(q)
    );
  }
  if(f.sort === 'time-asc') list.sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
  else list.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
  list = list.slice(0, 300);

  return `

    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

      <select class="select" id="histType">
        <option value="all" ${f.type==='all'?'selected':''}>Все типы</option>
        <option value="Приёмка" ${f.type==='Приёмка'?'selected':''}>Приёмка</option>
        <option value="Выдача" ${f.type==='Выдача'?'selected':''}>Выдача</option>
        <option value="Возврат" ${f.type==='Возврат'?'selected':''}>Возврат</option>
        <option value="Перемещение" ${f.type==='Перемещение'?'selected':''}>Перемещение</option>
      </select>
      <select class="select" id="histSort">
        <option value="time-desc" ${f.sort==='time-desc'?'selected':''}>Сначала новые</option>

      </select>
    </div>
    ${list.length === 0 ? emptyState('История пуста', 'Операции появятся здесь') :
      `<div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th>Время</th><th>Тип</th><th>Заказ</th><th>Сотрудник</th><th>Результат</th><th>Детали</th>
          </tr></thead>
          <tbody>
            ${list.map(h => {
              const u = getUser(h.employee);
              const badge = h.result === 'Успешно' ? 'b-success' : h.result === 'Оформлен' ? 'b-warning' : h.result === 'Ошибка' ? 'b-danger' : '';
              return `<tr data-history-details="${h.id}">
                <td class="td-mono">${escapeHtml(fmtDT(h.timestamp))}</td>
                <td><span class="badge b-primary">${escapeHtml(h.type)}</span></td>
                <td class="td-mono">${escapeHtml(h.orderNumber)}</td>

                <td style="color:var(--text-muted);font-size:.8rem">${escapeHtml(h.info)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`}
  </div>`;
}

function editEmployee(id){
  const e = getUser(id);
  if(!e) return;
  openModal({
    title:'Редактировать сотрудника',
    body:`
      <div class="form-group"><label>Имя</label><input class="input" id="empName" value="${escapeHtml(e.name)}"></div>
      <div class="form-group"><label>Роль</label>
        <select class="select" id="empRole" style="width:100%">
          ${ROLE_OPTIONS.map(r => `<option ${r===e.role?'selected':''}>${escapeHtml(r)}</option>`).join('')}
        </select>
      </div>`,
    actions:[
      {label:'Отмена', cls:'btn-secondary'},
      {label:'Сохранить', cls:'btn-primary', close:false, onClick: (overlay) => {
        const name = (overlay.querySelector('#empName').value || '').trim();
        const role = overlay.querySelector('#empRole').value;
        if(!name){ toast('Введите имя', 'warning'); return false; }
        e.name = name; e.role = role;
        saveEmployees();
        toast('Сотрудник обновлён', 'success');
        closeModal(); render();
      }}
    ]
  });
}

function addEmployeeFlow(){
  openModal({
    title:'Новый сотрудник',
    body:`
      <div class="form-group"><label>Имя и фамилия</label><input class="input" id="newEmpName" placeholder="Иванов Иван" autofocus></div>
      <div class="form-group"><label>Роль</label>
        <select class="select" id="newEmpRole" style="width:100%">
          ${ROLE_OPTIONS.map(r => `<option>${escapeHtml(r)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>Номер телефона</label><input class="input" type="tel" id="newEmpPhone" placeholder="+7 (900) 000-00-00" inputmode="tel"></div>
      <div class="form-group"><label>Логин</label><input class="input" id="newEmpLogin" placeholder="Латинские буквы и цифры"></div>
      <div class="form-group"><label>Пароль</label><input class="input" id="newEmpPass" placeholder="Минимум 3 символа"></div>`,
    actions:[
      {label:'Отмена', cls:'btn-secondary'},
      {label:'Создать', cls:'btn-primary', close:false, onClick: (overlay) => {
        const name = (overlay.querySelector('#newEmpName').value || '').trim();
        const role = overlay.querySelector('#newEmpRole').value;
        const phone = (overlay.querySelector('#newEmpPhone').value || '').trim();
        const login = (overlay.querySelector('#newEmpLogin').value || '').trim().toLowerCase();
        const pass = (overlay.querySelector('#newEmpPass').value || '').trim();
        if(!name || name.length < 2){ toast('Введите корректное имя', 'warning'); return false; }
        if(!/^[a-z0-9_]{3,}$/.test(login)){ toast('Логин: латиница/цифры, минимум 3 символа', 'warning'); return false; }
        if(state.employees.some(e => e.login === login)){ toast('Логин уже используется', 'warning'); return false; }
        if(phone && normalizePhone(phone).length < 11){ toast('Введите полный номер телефона', 'warning'); return false; }
        if(phone && state.employees.some(e => phoneMatch(e.phone, phone))){ toast('Телефон уже используется', 'warning'); return false; }
        if(pass.length < 3){ toast('Пароль слишком короткий', 'warning'); return false; }
        state.employees.push({
          id: uid('e'), name, role, active:true,
          login, password: pass,
          phone: normalizePhone(phone),
          createdAt: nowISO()
        });
        saveEmployees();
        toast('Сотрудник создан', 'success');
        closeModal(); render();
      }}
    ]
  });
}

    ${list.length === 0 ? emptyState('Уведомлений нет', 'Здесь появятся события') :
      `<div style="display:flex;flex-direction:column;gap:10px">
        ${list.map(n => {

            <div class="notif-ic ${ic}">${icon}</div>

              <div class="notif-title">${escapeHtml(n.title)}</div>

/* ============================================================
   EVENT BINDING
   ============================================================ */
function bindSectionEvents(){
  const content = document.getElementById('content');

  content.querySelectorAll('[data-goto]').forEach(el => {
    el.addEventListener('click', () => navigate(el.dataset.goto));
  });
  content.querySelectorAll('[data-order-details]').forEach(el => {
    el.addEventListener('click', () => showOrderDetails(el.dataset.orderDetails));
  });
  content.querySelectorAll('[data-history-details]').forEach(el => {
    el.addEventListener('click', () => {
      const h = state.history.find(x => x.id === el.dataset.historyDetails);
      if(!h) return;
      openModal({
        title:'Операция',
        subtitle:h.type + ' · ' + h.orderNumber,
        body:`
          <div class="detail-row"><span class="lbl">Время</span><span class="val">${escapeHtml(fmtDT(h.timestamp))}</span></div>
          <div class="detail-row"><span class="lbl">Заказ</span><span class="val" style="font-family:ui-monospace,monospace">${escapeHtml(h.orderNumber)}</span></div>
          <div class="detail-row"><span class="lbl">Сотрудник</span><span class="val">${escapeHtml(((getUser(h.employee))||{}).name || '—')}</span></div>
          <div class="detail-row"><span class="lbl">Результат</span><span class="val">${escapeHtml(h.result)}</span></div>
          <div class="detail-row"><span class="lbl">Детали</span><span class="val">${escapeHtml(h.info)}</span></div>`,
        actions:[{label:'Закрыть', cls:'btn-secondary'}]
      });
    });
  });

  // ===== RECEPTION =====
  if(state.currentSection === 'reception'){
    const barcodeInput = document.getElementById('recvBarcode');
    if(barcodeInput){
      barcodeInput.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); handleReceptionAdd(); }
      });
    }
    const addBtn = document.getElementById('recvAddBtn');
    if(addBtn) addBtn.addEventListener('click', handleReceptionAdd);
    const scanBtn = document.getElementById('recvScanBtn');
    if(scanBtn) scanBtn.addEventListener('click', () => openCameraScanner('reception'));
    const createBtn = document.getElementById('recvCreateBtn');
    if(createBtn) createBtn.addEventListener('click', addOrderFlow);
    const completeBtn = document.getElementById('recvComplete');
    if(completeBtn) completeBtn.addEventListener('click', completeReception);
    const cancelBtn = document.getElementById('recvCancel');
    if(cancelBtn) cancelBtn.addEventListener('click', cancelReception);
    content.querySelectorAll('[data-recv-remove]').forEach(b => {
      b.addEventListener('click', () => {
        state.reception.items = state.reception.items.filter(i => i.id !== b.dataset.recvRemove);
        render();
      });
    });
  }

  // ===== ISSUE =====
  if(state.currentSection === 'issue'){
    const scanInput = document.getElementById('issueScanInput');
    if(scanInput){
      scanInput.addEventListener('keydown', e => {
        if(e.key === 'Enter'){
          e.preventDefault();
          const code = scanInput.value.trim();
          if(!code) return;
          handleIssueScanResult(code);
        }
      });
    }

    const l4 = document.getElementById('issueLast4');
    if(l4){
      l4.addEventListener('input', handleIssueLast4Change);
      l4.addEventListener('keydown', e => {
        if(e.key === 'Enter'){
          e.preventDefault();
          if(l4.value.length === 4){
            const ci = document.getElementById('issueClientCode');
            if(ci) ci.focus();
          }
        }
      });
    }
    const cc = document.getElementById('issueClientCode');
    if(cc){
      cc.addEventListener('input', handleIssueClientCodeInput);
      cc.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); handleIssueClientCodeInput(); }
      });
    }
    bindIssueConfirm();
  }

  // ===== RETURNS =====
  if(state.currentSection === 'returns'){
    const rs = document.getElementById('returnSearch');
    const rb = document.getElementById('returnFindBtn');
    if(rs && rb){
      rb.addEventListener('click', () => renderReturnResult(rs.value.trim()));
      rs.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); renderReturnResult(rs.value.trim()); }});
    }
    const rls = document.getElementById('returnListSearch');
    if(rls){
      rls.addEventListener('input', () => {
        state.filters.returns.q = rls.value;
        const cur = rls.value;
        render();
        const ni = document.getElementById('returnListSearch');
        if(ni){ ni.focus(); ni.setSelectionRange(cur.length, cur.length); }
      });
    }
  }

  // ===== WAREHOUSE =====
  if(state.currentSection === 'warehouse'){
    const ws = document.getElementById('whSearch');
    if(ws) ws.addEventListener('input', () => {
      state.filters.warehouse.q = ws.value;
      const cur = ws.value;
      render();
      const ni = document.getElementById('whSearch');
      if(ni){ ni.focus(); ni.setSelectionRange(cur.length, cur.length); }
    });
    const wst = document.getElementById('whStatus');
    if(wst) wst.addEventListener('change', () => { state.filters.warehouse.status = wst.value; render(); });
  }

  // ===== HISTORY =====
  if(state.currentSection === 'history'){
    const hs = document.getElementById('histSearch');
    if(hs) hs.addEventListener('input', () => {
      state.filters.history.q = hs.value;
      const cur = hs.value;
      render();
      const ni = document.getElementById('histSearch');
      if(ni){ ni.focus(); ni.setSelectionRange(cur.length, cur.length); }
    });
    const ht = document.getElementById('histType');
    if(ht) ht.addEventListener('change', () => { state.filters.history.type = ht.value; render(); });
    const hsort = document.getElementById('histSort');
    if(hsort) hsort.addEventListener('change', () => { state.filters.history.sort = hsort.value; render(); });
  }

  // ===== EMPLOYEES =====
  if(state.currentSection === 'employees'){
    const addBtn = document.getElementById('addEmployeeBtn');
    if(addBtn) addBtn.addEventListener('click', addEmployeeFlow);
    content.querySelectorAll('[data-emp-edit]').forEach(b => {
      b.addEventListener('click', () => editEmployee(b.dataset.empEdit));
    });
    content.querySelectorAll('[data-emp-deact]').forEach(b => {
      b.addEventListener('click', () => {
        const e = getUser(b.dataset.empDeact);
        if(!e) return;
        if(e.id === state.currentUser){ toast('Нельзя деактивировать текущего пользователя', 'warning'); return; }
        confirmDialog('Деактивировать сотрудника?', 'Сотрудник «' + e.name + '» не сможет входить в систему.',
          () => { e.active = false; saveEmployees(); toast('Сотрудник деактивирован', 'success'); render(); });
      });
    });
    content.querySelectorAll('[data-emp-activate]').forEach(b => {
      b.addEventListener('click', () => {
        const e = getUser(b.dataset.empActivate);
        if(!e) return;
        e.active = true; saveEmployees(); toast('Сотрудник активирован', 'success'); render();
      });
    });
  }

  // ===== NOTIFICATIONS =====
  if(state.currentSection === 'notifications'){
    const toggle = document.getElementById('notifToggleUnread');
    if(toggle) toggle.addEventListener('click', () => {
      state.filters.notifications.showUnread = !state.filters.notifications.showUnread;
      render();
    });
    const markAll = document.getElementById('notifMarkAll');
    if(markAll) markAll.addEventListener('click', () => {
      state.notifications.forEach(n => n.read = true);
      saveNotifications();
      updateNotifBadge();
      renderNav();
      toast('Все прочитаны', 'success');
      render();
    });
    content.querySelectorAll('[data-notif]').forEach(el => {
      el.addEventListener('click', () => {
        const n = state.notifications.find(x => x.id === el.dataset.notif);
        if(!n || n.read) return;
        n.read = true;
        saveNotifications();
        updateNotifBadge();
        renderNav();
        render();
      });
    });
  }

  // ===== SETTINGS =====
  if(state.currentSection === 'settings'){
    const savePvn = document.getElementById('savePvnBtn');
    if(savePvn) savePvn.addEventListener('click', () => {
      const v = (document.getElementById('setPvnName').value || '').trim();
      if(!v){ toast('Введите название', 'warning'); return; }
      state.settings.pvnName = v;
      saveSettings();
      toast('Настройки сохранены', 'success');
    });
    content.querySelectorAll('[data-theme-btn]').forEach(b => {
      b.addEventListener('click', () => {
        state.settings.theme = b.dataset.themeBtn;
        saveSettings(); applyTheme(); render();
      });
    });
    content.querySelectorAll('[data-scale]').forEach(b => {
      b.addEventListener('click', () => {
        state.settings.uiScale = parseFloat(b.dataset.scale);
        saveSettings(); applyUiScale(); render();
      });
    });
    const soundToggle = document.getElementById('soundToggle');
    if(soundToggle) soundToggle.addEventListener('change', () => {
      state.settings.sound = soundToggle.checked;
      saveSettings();
      if(soundToggle.checked) beep('success');
    });
    const resetAll = document.getElementById('resetAllBtn');
    if(resetAll) resetAll.addEventListener('click', () => {
      confirmDialog('Сбросить все данные?', 'Все заказы, история и сотрудники будут удалены. Действие необратимо.', () => {
        resetAllData();
      }, {danger:true, confirmLabel:'Сбросить'});
    });
    const restore = document.getElementById('restoreOrdersBtn');
    if(restore) restore.addEventListener('click', () => {
      confirmDialog('Очистить все заказы?', 'Заказы и история будут удалены.', () => {
        clearOrdersOnly();
      }, {danger:true, confirmLabel:'Очистить'});
    });
  }
}

/* ============================================================
   CAMERA SCANNER (MODAL - for reception on mobile)
   ============================================================ */
async function openCameraScanner(context){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('Камера недоступна: браузер не поддерживает MediaDevices', 'warning');
    pushNotification('warning', 'Камера недоступна', 'Используйте ручной ввод');
    return;
  }
  const overlay = openModal({
    title:'Сканирование камерой',
    subtitle:'Наведите камеру на штрихкод товара',
    body:`
      <div id="scannerArea" style="background:var(--surface-2);border-radius:var(--radius);min-height:280px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative">
        <div style="color:var(--text-muted);font-size:.85rem">Запрос доступа к камере…</div>
      </div>
      <div class="form-group" style="margin-top:14px">
        <label for="scannerManual">Или введите штрихкод вручную</label>
        <div style="display:flex;gap:8px">
          <input class="input" id="scannerManual" placeholder="Штрихкод">
          <button class="btn btn-primary" id="scannerManualBtn">ОК</button>
        </div>
      </div>
      <div style="font-size:.78rem;color:var(--text-muted);margin-top:6px">
        Камера работает по HTTPS или localhost.
      </div>`,
    actions:[{label:'Закрыть', cls:'btn-secondary'}]
  });
  const manualInput = document.getElementById('scannerManual');
  const manualBtn = document.getElementById('scannerManualBtn');
  if(manualBtn) manualBtn.addEventListener('click', () => {
    const v = (manualInput.value || '').trim();
    if(!v){ toast('Введите код', 'warning'); return; }
    applyScannedCode(v, context);
    overlay._close();
  });
  if(manualInput) manualInput.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); manualBtn.click(); }
  });

  let stream = null;
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(err){
    const area = document.getElementById('scannerArea');
    if(area){
      area.innerHTML = `<div style="padding:22px;text-align:center;color:var(--text-muted);font-size:.85rem">
        <div style="font-weight:600;color:var(--text-2);margin-bottom:6px">Нет доступа к камере</div>
        Разрешите доступ в браузере или используйте ручной ввод
      </div>`;
    }
    toast('Доступ к камере не получен', 'warning');
    return;
  }

  const area = document.getElementById('scannerArea');
  if(!area){ stream.getTracks().forEach(t => t.stop()); return; }
  area.innerHTML = '';

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  video.muted = true;
  video.style.width = '100%';
  video.style.height = '100%';
  video.style.objectFit = 'cover';
  video.style.borderRadius = 'var(--radius)';
  area.appendChild(video);
  video.srcObject = stream;
  try{ await video.play(); }catch(e){}

  const origClose = overlay._close;
  overlay._close = () => {
    try{ stream.getTracks().forEach(t => t.stop()); }catch(e){}
    origClose();
  };

  let nativeDetector = null;
  if('BarcodeDetector' in window){
    try {
      nativeDetector = new window.BarcodeDetector({
        formats: ['qr_code','code_128','code_39','ean_13','codabar','itf']
      });
    } catch(e){ nativeDetector = null; }
  }

  let jsQR = null;
  if(!nativeDetector){
    try { jsQR = await loadJsQR(); } catch(e){}
  }

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let stopped = false;
  let frameCounter = 0;

  const scan = async () => {
    if(stopped) return;
    if(!video.parentNode){ stopped = true; return; }

    let code = null;
    try {
      if(nativeDetector){
        const codes = await nativeDetector.detect(video);
        if(codes && codes.length > 0 && codes[0].rawValue){
          code = codes[0].rawValue;
        }
      } else if(jsQR && video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0){
        frameCounter++;
        if(frameCounter % 3 === 0){
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const result = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: 'dontInvert'
          });
          if(result && result.data){ code = result.data; }
        }
      }
    } catch(e){}

    if(code){
      stopped = true;
      try{ stream.getTracks().forEach(t => t.stop()); }catch(e){}
      applyScannedCode(code, context);
      overlay._close();
      return;
    }

    if(!stopped) requestAnimationFrame(scan);
  };
  requestAnimationFrame(scan);
}

function applyScannedCode(code, context){
  if(context === 'reception' || state.currentSection === 'reception'){
    const input = document.getElementById('recvBarcode');
    if(input){ input.value = code; }
    handleReceptionAdd();
  } else {
    handleIssueScanResult(code);
  }
}

/* ============================================================
   LOGIN / REGISTER / LOGOUT
   ============================================================ */
function showLogin(){
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  showLoginView();
}
function hideLogin(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}
function showLoginView(){
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('registerView').classList.add('hidden');
}
function showRegisterView(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('registerView').classList.remove('hidden');
  state.register = {step:1, phone:'', login:'', password:'', firstName:'', lastName:''};
  renderRegisterStep();
}
function setLoginMode(mode){
  state.loginMode = mode;
  document.querySelectorAll('#modeToggle .mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  document.getElementById('phoneGroup').classList.toggle('hidden', mode !== 'phone');
  document.getElementById('loginGroup').classList.toggle('hidden', mode !== 'login');
  document.getElementById('loginError').textContent = '';
}
function handleLogin(e){
  if(e) e.preventDefault();
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  const pass = document.getElementById('passwordInput').value || '';

  let emp = null;
  if(state.loginMode === 'phone'){
    const phone = (document.getElementById('phoneInput').value || '').trim();
    if(!phone){ errEl.textContent = 'Введите номер телефона'; return; }
    if(normalizePhone(phone).length < 11){ errEl.textContent = 'Введите полный номер телефона'; return; }
    if(!pass){ errEl.textContent = 'Введите пароль'; return; }
    emp = state.employees.find(e => phoneMatch(e.phone, phone));
  } else {
    const login = (document.getElementById('loginInput').value || '').trim().toLowerCase();
    if(!login){ errEl.textContent = 'Введите логин'; return; }
    if(!pass){ errEl.textContent = 'Введите пароль'; return; }
    emp = state.employees.find(e => e.login === login);
  }

  if(!emp){ errEl.textContent = 'Аккаунт не найден'; return; }
  if(emp.password !== pass){ errEl.textContent = 'Неверный пароль'; return; }
  if(!emp.active){ errEl.textContent = 'Учётная запись деактивирована'; return; }

  state.currentUser = emp.id;
  saveSession();
  document.getElementById('passwordInput').value = '';
  const firstName = (emp.name||'').split(' ')[0];
  toast('Добро пожаловать, ' + (firstName || 'сотрудник') + '!', 'success');
  render();
}
function handleLogout(){
  confirmDialog('Выйти из системы?', 'Текущая сессия будет завершена.', () => {
    state.currentUser = null;
    saveSession();
    state.currentSection = 'issue';
    stopIssueAutoScanner();
    showLogin();
    toast('Вы вышли из системы', 'info');
  });
}

/* ============================================================
   REGISTER FLOW
   ============================================================ */
function renderRegisterStep(){
  const step = state.register.step;
  const titles = {
    1:'Шаг 1 из 3 · Номер телефона',
    2:'Шаг 2 из 3 · Логин и пароль',
    3:'Шаг 3 из 3 · Имя и фамилия'
  };
  document.getElementById('registerSubtitle').textContent = titles[step];
  document.querySelectorAll('#registerSteps .step').forEach(s => {
    const n = parseInt(s.dataset.step);
    s.classList.remove('active', 'done');
    if(n < step) s.classList.add('done');
    if(n === step) s.classList.add('active');
  });
  document.getElementById('registerError').textContent = '';

  const content = document.getElementById('registerStepContent');
  if(step === 1){
    content.innerHTML = `
      <div class="form-group">
        <label for="regPhone">Номер телефона</label>
        <input class="input" type="tel" id="regPhone" placeholder="+7 (900) 000-00-00" value="${escapeHtml(state.register.phone)}" autofocus inputmode="tel">
      </div>
      <button type="button" class="btn btn-primary btn-block btn-lg" id="regNext">Далее</button>
      <div style="margin-top:14px;text-align:center">
        <span class="register-link" id="regBack">Назад ко входу</span>
      </div>`;
    const phoneInput = document.getElementById('regPhone');
    attachPhoneFormatter(phoneInput, {autoStart:true});
    const next = document.getElementById('regNext');
    const back = document.getElementById('regBack');
    next.addEventListener('click', () => {
      const v = phoneInput.value.trim();
      if(normalizePhone(v).length < 11){ document.getElementById('registerError').textContent = 'Введите полный номер телефона'; return; }
      if(state.employees.some(e => phoneMatch(e.phone, v))){ document.getElementById('registerError').textContent = 'Этот номер уже зарегистрирован'; return; }
      state.register.phone = v;
      state.register.step = 2;
      renderRegisterStep();
    });
    back.addEventListener('click', showLoginView);
    phoneInput.addEventListener('keydown', e => { if(e.key === 'Enter') next.click(); });
  }
  else if(step === 2){
    content.innerHTML = `
      <div class="form-group">
        <label for="regLogin">Логин</label>
        <input class="input" type="text" id="regLogin" placeholder="Латинские буквы и цифры" value="${escapeHtml(state.register.login)}" autofocus>
      </div>
      <div class="form-group">
        <label for="regPassword">Пароль</label>
        <div class="password-wrapper">
          <input class="input" type="password" id="regPassword" placeholder="Минимум 3 символа" value="${escapeHtml(state.register.password)}">
          <button type="button" class="icon-btn" id="regTogglePass" aria-label="Показать пароль">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="button" class="btn btn-primary btn-block btn-lg" id="regNext">Далее</button>
      <div style="margin-top:14px;text-align:center;display:flex;justify-content:space-between">
        <span class="register-link" id="regBack">Назад</span>
        <span class="register-link" id="regCancel">Отмена</span>
      </div>`;
    const loginInput = document.getElementById('regLogin');
    const passInput = document.getElementById('regPassword');
    const togglePass = document.getElementById('regTogglePass');
    const next = document.getElementById('regNext');
    const back = document.getElementById('regBack');
    const cancel = document.getElementById('regCancel');
    togglePass.addEventListener('click', () => {
      if(passInput.type === 'password'){ passInput.type = 'text'; }
      else { passInput.type = 'password'; }
    });
    next.addEventListener('click', () => {
      const login = loginInput.value.trim().toLowerCase();
      const pass = passInput.value;
      if(!/^[a-z0-9_]{3,}$/.test(login)){ document.getElementById('registerError').textContent = 'Логин: латиница/цифры, минимум 3 символа'; return; }
      if(state.employees.some(e => e.login === login)){ document.getElementById('registerError').textContent = 'Логин уже занят'; return; }
      if(pass.length < 3){ document.getElementById('registerError').textContent = 'Пароль слишком короткий'; return; }
      state.register.login = login;
      state.register.password = pass;
      state.register.step = 3;
      renderRegisterStep();
    });
    back.addEventListener('click', () => { state.register.step = 1; renderRegisterStep(); });
    cancel.addEventListener('click', showLoginView);
    const onEnter = e => { if(e.key === 'Enter') next.click(); };
    loginInput.addEventListener('keydown', onEnter);
    passInput.addEventListener('keydown', onEnter);
  }
  else if(step === 3){
    content.innerHTML = `
      <div class="form-group">
        <label for="regFirstName">Имя</label>
        <input class="input" type="text" id="regFirstName" placeholder="Иван" value="${escapeHtml(state.register.firstName)}" autofocus>
      </div>
      <div class="form-group">
        <label for="regLastName">Фамилия</label>
        <input class="input" type="text" id="regLastName" placeholder="Иванов" value="${escapeHtml(state.register.lastName)}">
      </div>
      <button type="button" class="btn btn-primary btn-block btn-lg" id="regFinish">Завершить регистрацию</button>
      <div style="margin-top:14px;text-align:center;display:flex;justify-content:space-between">
        <span class="register-link" id="regBack">Назад</span>
        <span class="register-link" id="regCancel">Отмена</span>
      </div>`;
    const fnInput = document.getElementById('regFirstName');
    const lnInput = document.getElementById('regLastName');
    const finish = document.getElementById('regFinish');
    const back = document.getElementById('regBack');
    const cancel = document.getElementById('regCancel');
    finish.addEventListener('click', () => {
      const fn = fnInput.value.trim();
      const ln = lnInput.value.trim();
      if(!fn || fn.length < 2){ document.getElementById('registerError').textContent = 'Введите имя'; return; }
      if(!ln || ln.length < 2){ document.getElementById('registerError').textContent = 'Введите фамилию'; return; }
      state.register.firstName = fn;
      state.register.lastName = ln;
      completeRegistration();
    });
    back.addEventListener('click', () => { state.register.step = 2; renderRegisterStep(); });
    cancel.addEventListener('click', showLoginView);
    const onEnter = e => { if(e.key === 'Enter') finish.click(); };
    fnInput.addEventListener('keydown', onEnter);
    lnInput.addEventListener('keydown', onEnter);
  }
}

function completeRegistration(){
  const r = state.register;
  const fullName = (r.firstName + ' ' + r.lastName).trim();
  const emp = {
    id: uid('e'),
    name: fullName,
    role: 'Сотрудник',
    active: true,
    login: r.login,
    password: r.password,
    phone: normalizePhone(r.phone),
    createdAt: nowISO()
  };
  state.employees.push(emp);
  saveEmployees();
  toast('Регистрация завершена! Теперь можно войти', 'success', 'Добро пожаловать!');
  showLoginView();
  setLoginMode('login');
  document.getElementById('loginInput').value = r.login;
  const pi = document.getElementById('phoneInput');
  if(pi) pi.value = formatPhoneDisplay(r.phone);
  document.getElementById('loginError').textContent = '';
  document.getElementById('passwordInput').value = '';
  state.register = {step:1, phone:'', login:'', password:'', firstName:'', lastName:''};
}

/* ============================================================
   THEME / UI SCALE / CLOCK
   ============================================================ */
function applyTheme(){
  const theme = state.settings.theme || 'light';
  if(theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  const tc = document.querySelector('meta[name="theme-color"]');
  if(tc) tc.setAttribute('content', theme === 'dark' ? '#0d0d12' : '#7c3aed');
}
function applyUiScale(){
  document.documentElement.style.setProperty('--ui-scale', String(state.settings.uiScale || 1));
}
function startClock(){
  const t = document.getElementById('topbarTime');
  const tick = () => {
    const str = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    if(t) t.textContent = str;
    const h = document.getElementById('heroClock');
    if(h) h.textContent = str;
  };
  tick();
  setInterval(tick, 15000);
}

/* ============================================================
   DATA RESET
   ============================================================ */
function resetAllData(){
  stopIssueAutoScanner();
  state.orders = [];
  state.history = [];
  state.employees = [];
  state.notifications = [];
  state.reception.items = [];
  state.reception.errors = 0;
  state.issueLookup = {last4:'', orderId:null, code:''};
  state.currentUser = null;
  saveOrders(); saveHistory(); saveEmployees(); saveNotifications();
  saveSession();
  toast('Все данные удалены', 'success');
  showLogin();
}

function clearOrdersOnly(){
  state.orders = [];
  state.history = [];
  state.reception.items = [];
  state.reception.errors = 0;
  saveOrders(); saveHistory();
  toast('Заказы и история очищены', 'success');
  render();
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  loadState();
  applyTheme();
  applyUiScale();

  document.getElementById('loginForm').addEventListener('submit', handleLogin);

  document.querySelectorAll('#modeToggle .mode-btn').forEach(b => {
    b.addEventListener('click', () => setLoginMode(b.dataset.mode));
  });
  setLoginMode('phone');

  const togglePass = document.getElementById('togglePassword');
  togglePass.addEventListener('click', () => {
    const p = document.getElementById('passwordInput');
    if(p.type === 'password'){
      p.type = 'text';
      togglePass.querySelector('svg').innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      p.type = 'password';
      togglePass.querySelector('svg').innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  });

  const phoneInput = document.getElementById('phoneInput');
  attachPhoneFormatter(phoneInput, {autoStart:true});

  document.getElementById('registerLink').addEventListener('click', showRegisterView);

  document.getElementById('logoutBtn').addEventListener('click', handleLogout);
  document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
  document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);
  document.getElementById('notifBtn').addEventListener('click', () => navigate('notifications'));

  window.addEventListener('resize', () => {
    if(window.innerWidth > 900) closeSidebar();
    updateLayout();
  });

  startClock();

  if(state.currentUser){ hideLogin(); render(); }
  else { showLogin(); }
}

window.VEXA = {state, toast};

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
